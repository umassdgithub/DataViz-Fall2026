<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brush Select Marks with Stored Items</title>
    <style>
        svg{
            width: 40vw;
            height: 40vw;
        }
        #selected_count{
            font-family: sans-serif;
            font-size: 14pt;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/scatter_plot_brush_Select_Marks.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<p id="selected_count">Selected marks: 0</p>
<div>
    <svg viewBox="0 0 1000 1000" id="figure1">
    </svg>
</div>
<script>

    d3.tsv("./data/palmer_penguin_species.tsv")
        .then(
         data=>{
            let selected_items = []
            scatter_plot(
                data=data,
                "#figure1",
                title="Penguins",
                xCol="culmen_length_mm",
                yCol="body_mass_g",
                rCol="culmen_depth_mm",
                legend=[],
                colorCol="species",
                margin=150,
                selected_items=selected_items,
                on_select=items=>d3.select("#selected_count").text(`Selected marks: ${items.length}`)
            )
        }
    )
</script>
</body>
</html>
