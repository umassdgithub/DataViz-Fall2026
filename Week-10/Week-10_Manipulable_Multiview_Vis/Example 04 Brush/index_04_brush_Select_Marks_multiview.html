<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brush Select Marks Multiview</title>
    <style>
        svg{
            width: 30vw;
            height: 30vw;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/scatter_plot_brush_Select_Marks.js"></script>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<div>
    <svg viewBox="0 0 1000 1000" id="figure1">
    </svg>
    <svg viewBox="0 0 1000 1000" id="figure2">
    </svg>
</div>
<div>
    <svg viewBox="0 0 1000 1000" id="figure3">
    </svg>
    <svg viewBox="0 0 1000 1000" id="figure4">
    </svg>
</div>
<script>

    d3.tsv("./data/palmer_penguin_species.tsv")
        .then(
         data=>{

             scatter_plot(
                 data=data,
                 "#figure1",
                 title="Penguins",
                 xCol="culmen_length_mm",
                 yCol="body_mass_g",
                 rCol="culmen_depth_mm",
                 legend=[],
                 colorCol="species",
                 margin=150
             )

             scatter_plot(
                 data=data,
                 "#figure2",
                 title="Penguins",
                 xCol="flipper_length_mm",
                 yCol="body_mass_g",
                 rCol="culmen_depth_mm",
                 legend=[],
                 colorCol="species",
                 margin=150
             )



             scatter_plot(
                 data=data,
                 "#figure3",
                 title="Penguins",
                 xCol="culmen_length_mm",
                 yCol="culmen_depth_mm",
                 rCol="culmen_depth_mm",
                 legend=[],
                 colorCol="species",
                 margin=150
             )

             scatter_plot(
                 data=data,
                 "#figure4",
                 title="Penguins",
                 xCol="flipper_length_mm",
                 yCol="culmen_depth_mm",
                 rCol="culmen_depth_mm",
                 legend=[],
                 colorCol="species",
                 margin=150

             )

        }
    )
</script>
</body>
</html>
