<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <title>One rect element, three shapes</title>
  <desc>The same SVG rect drawn three ways: a circle when rx is half the width, a square when rx is zero, and a wide flat bar slice.</desc>
  <rect width="820" height="250" fill="#ffffff"/>

  <rect x="100" y="60" width="60" height="60" rx="30" fill="#d95f02"/>
  <text x="130" y="160" text-anchor="middle" fill="#1f2328" font-weight="bold">a dot</text>
  <text x="130" y="182" text-anchor="middle" fill="#3d4651" font-family="Courier New, monospace" font-size="14">width=10 height=10</text>
  <text x="130" y="200" text-anchor="middle" fill="#3d4651" font-family="Courier New, monospace" font-size="14">rx=5</text>

  <rect x="350" y="60" width="60" height="60" rx="0" fill="#d95f02"/>
  <text x="380" y="160" text-anchor="middle" fill="#1f2328" font-weight="bold">a square</text>
  <text x="380" y="182" text-anchor="middle" fill="#3d4651" font-family="Courier New, monospace" font-size="14">width=10 height=10</text>
  <text x="380" y="200" text-anchor="middle" fill="#3d4651" font-family="Courier New, monospace" font-size="14">rx=0</text>

  <rect x="560" y="80" width="200" height="20" rx="0" fill="#d95f02"/>
  <text x="660" y="160" text-anchor="middle" fill="#1f2328" font-weight="bold">a bar slice</text>
  <text x="660" y="182" text-anchor="middle" fill="#3d4651" font-family="Courier New, monospace" font-size="14">width=band height=1 unit</text>
  <text x="660" y="200" text-anchor="middle" fill="#3d4651" font-family="Courier New, monospace" font-size="14">rx=0</text>

  <text x="410" y="236" text-anchor="middle" fill="#57606a" font-size="13">D3 animates width, height and rx together, so one element morphs from the first shape to the last.</text>
</svg>
