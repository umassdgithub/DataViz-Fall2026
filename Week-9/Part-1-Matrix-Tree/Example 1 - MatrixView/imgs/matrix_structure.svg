<svg xmlns="http://www.w3.org/2000/svg" width="470" height="215" viewBox="0 0 470 215" font-family="Helvetica, Arial, sans-serif">
<title>Matrix structure: row groups</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
</defs>
<rect width="470" height="215" rx="8" fill="#ffffff" stroke="#ddd"/>
<text x="20" y="24" font-size="14" font-weight="bold" fill="#222">One &lt;g class="row"&gt; per target state</text>
<text x="105" y="52" font-size="12" fill="#e08a1e" text-anchor="middle">A</text>
<text x="141" y="52" font-size="12" fill="#e08a1e" text-anchor="middle">B</text>
<text x="177" y="52" font-size="12" fill="#e08a1e" text-anchor="middle">C</text>
<rect x="22" y="59" width="178" height="36" rx="4" fill="none" stroke="#3b6fb6" stroke-dasharray="4 3"/>
<text x="76" y="81" font-size="12" fill="#3b6fb6" text-anchor="end">A</text>
<rect x="90" y="62" width="30" height="30" fill="#2e7d32"/>
<rect x="126" y="62" width="30" height="30" fill="#e8f5e9"/>
<rect x="162" y="62" width="30" height="30" fill="#a5d6a7"/>
<rect x="22" y="99" width="178" height="36" rx="4" fill="none" stroke="#3b6fb6" stroke-dasharray="4 3"/>
<text x="76" y="121" font-size="12" fill="#3b6fb6" text-anchor="end">B</text>
<rect x="90" y="102" width="30" height="30" fill="#e8f5e9"/>
<rect x="126" y="102" width="30" height="30" fill="#2e7d32"/>
<rect x="162" y="102" width="30" height="30" fill="#e8f5e9"/>
<rect x="22" y="139" width="178" height="36" rx="4" fill="none" stroke="#3b6fb6" stroke-dasharray="4 3"/>
<text x="76" y="161" font-size="12" fill="#3b6fb6" text-anchor="end">C</text>
<rect x="90" y="142" width="30" height="30" fill="#a5d6a7"/>
<rect x="126" y="142" width="30" height="30" fill="#e8f5e9"/>
<rect x="162" y="142" width="30" height="30" fill="#2e7d32"/>
<line x1="204" y1="78" x2="250" y2="78" stroke="#222" marker-start="url(#arr)"/>
<text x="256" y="74" font-size="12" fill="#3b6fb6">g.row</text>
<text x="256" y="90" font-size="11" fill="#777">transform = translate(0, y(name))</text>
<line x1="182" y1="157" x2="250" y2="150" stroke="#222" marker-start="url(#arr)"/>
<text x="256" y="146" font-size="12" fill="#2e7d32">rect.cell</text>
<text x="256" y="162" font-size="11" fill="#777">x = x(source)</text>
<text x="20" y="200" font-size="11" fill="#777">Moving a row = changing one transform. The label moves with it for free.</text>
</svg>
