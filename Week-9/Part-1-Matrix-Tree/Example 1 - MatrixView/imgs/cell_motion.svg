<svg xmlns="http://www.w3.org/2000/svg" width="380" height="215" viewBox="0 0 380 215" font-family="Helvetica, Arial, sans-serif">
<title>One cell's motion</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
</defs>
<rect width="380" height="215" rx="8" fill="#ffffff" stroke="#ddd"/>
<text x="20" y="24" font-size="14" font-weight="bold" fill="#222">How one cell travels</text>
<rect x="60" y="60" width="28" height="28" fill="#2e7d32" opacity="0.35"/>
<text x="74" y="54" font-size="10" fill="#777" text-anchor="middle">before</text>
<rect x="250" y="150" width="28" height="28" fill="#2e7d32"/>
<text x="264" y="194" font-size="10" fill="#777" text-anchor="middle">after</text>
<line x1="74" y1="92" x2="74" y2="164" stroke="#3b6fb6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="80" y="125" font-size="11" fill="#3b6fb6">row g moves</text>
<text x="80" y="139" font-size="10" fill="#777">translate(0, y(target))</text>
<line x1="74" y1="164" x2="246" y2="164" stroke="#e08a1e" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr)"/>
<text x="165" y="184" font-size="11" fill="#e08a1e" text-anchor="middle">rect x moves: x(source)</text>
<path d="M88,74 Q210,70 256,146" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="220" y="68" font-size="11" fill="#222">what you see:</text>
<text x="220" y="82" font-size="11" fill="#222">both at once</text>
</svg>
