<text x="98" y="196" font-size="11" fill="#777" text-anchor="middle">pattern is scattered</text>
<text x="268" y="196" font-size="11" fill="#777" text-anchor="middle">stripes, no blocks</text>
<text x="438" y="196" font-size="11" fill="#777" text-anchor="middle">two pockets on the diagonal</text>
<text x="20" y="222" font-size="11" fill="#777">A↔C and B↔D exchange many migrants. A shared order puts each pair together on both axes.</text>
