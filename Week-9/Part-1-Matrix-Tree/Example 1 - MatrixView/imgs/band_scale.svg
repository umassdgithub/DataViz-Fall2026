<svg xmlns="http://www.w3.org/2000/svg" width="470" height="255" viewBox="0 0 470 255" font-family="Helvetica, Arial, sans-serif">
<title>Band scale domain change</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
  </marker>
</defs>
<rect width="470" height="255" rx="8" fill="#ffffff" stroke="#ddd"/>
<text x="20" y="24" font-size="14" font-weight="bold" fill="#222">Sorting = giving the band scale a new domain</text>
<text x="120" y="56" font-size="11" fill="#777" text-anchor="middle">y.domain(["A","B","C","D"])</text>
<text x="340" y="56" font-size="11" fill="#777" text-anchor="middle">y.domain(["C","A","D","B"])</text>
<text x="40" y="90" font-size="11" fill="#777">y = 0</text>
<rect x="100" y="70" width="40" height="30" rx="3" fill="#3b6fb6"/>
<text x="120" y="90" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">A</text>
<rect x="320" y="70" width="40" height="30" rx="3" fill="#2e7d32"/>
<text x="340" y="90" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">C</text>
<text x="40" y="128" font-size="11" fill="#777">y = 38</text>
<rect x="100" y="108" width="40" height="30" rx="3" fill="#e08a1e"/>
<text x="120" y="128" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">B</text>
<rect x="320" y="108" width="40" height="30" rx="3" fill="#3b6fb6"/>
<text x="340" y="128" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">A</text>
<text x="40" y="166" font-size="11" fill="#777">y = 76</text>
<rect x="100" y="146" width="40" height="30" rx="3" fill="#2e7d32"/>
<text x="120" y="166" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">C</text>
<rect x="320" y="146" width="40" height="30" rx="3" fill="#8e44ad"/>
<text x="340" y="166" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">D</text>
<text x="40" y="204" font-size="11" fill="#777">y = 114</text>
<rect x="100" y="184" width="40" height="30" rx="3" fill="#8e44ad"/>
<text x="120" y="204" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">D</text>
<rect x="320" y="184" width="40" height="30" rx="3" fill="#e08a1e"/>
<text x="340" y="204" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">B</text>
<line x1="144" y1="85" x2="314" y2="123" stroke="#3b6fb6" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="144" y1="123" x2="314" y2="199" stroke="#e08a1e" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="144" y1="161" x2="314" y2="85" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="144" y1="199" x2="314" y2="161" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="20" y="240" font-size="11" fill="#777">Same scale, same range [0, size]; only the order of the domain changed, so y("C") is now 0.</text>
</svg>
