<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluesky Hashtag Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #fff; color: #222; }
        header { padding: 10px 16px; border-bottom: 1px solid #ddd; }
        h1 { font-size: 18px; margin: 0 0 4px; }
        #status { font-size: 13px; color: #666; }
        svg { display: block; width: 100vw; height: calc(100vh - 60px); }
        circle { fill: steelblue; stroke: #fff; stroke-width: 1.5px; cursor: grab; }
        .label { pointer-events: none; }   /* the font size is set in main.js, from the circle size */
        line { stroke: #999; stroke-opacity: 0.6; }
        .tooltip {
            display: none; position: absolute; pointer-events: none;
            width: 360px; max-height: 70vh; overflow: hidden;
            background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 8px 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); font-size: 12px;
        }
        .tooltip p { margin: 6px 0 0; padding-top: 6px; border-top: 1px solid #eee; overflow-wrap: anywhere; }
    </style>
</head>
<body>
<header>
    <h1>Bluesky hashtags, last 5 minutes</h1>
    <div id="status">Connecting…</div>
</header>
<svg></svg>
<script src="main.js"></script>
</body>
</html>
